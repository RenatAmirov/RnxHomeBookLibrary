<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f9f8f4">
  <title>Книжная полка — домашняя библиотека</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" type="module"></script>
</head>
<body>
  <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/><path d="M8 7h8m-8 4h5"/></symbol>
    <symbol id="i-open" viewBox="0 0 24 24"><path d="M12 7v14m0-14C9 4 5 4 2 5v14c4-1 7-1 10 2 3-3 6-3 10-2V5c-3-1-7-1-10 2Z"/><path d="M6 9c1-.1 2 .1 3 .6M18 9c-1-.1-2 .1-3 .6"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></symbol>
    <symbol id="i-tag" viewBox="0 0 24 24"><path d="M20.5 13.4 13.4 20.5a2 2 0 0 1-2.8 0L3 12.9V3h9.9l7.6 7.6a2 2 0 0 1 0 2.8Z"/><path d="M7.5 7.5h.01" stroke-width="3"/></symbol>
    <symbol id="i-loan" viewBox="0 0 24 24"><path d="M11 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h6m4-3 5-5-5-5m5 5H8"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 1 1 8 0v4m-4 4v2"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.4"/><path d="M5 20v-1a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v1"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.7" cy="10.7" r="6.5"/><path d="m16 16 4 4"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-sort" viewBox="0 0 24 24"><path d="M8 4v16m-4-4 4 4 4-4m4 4V4m-4 4 4-4 4 4"/></symbol>
    <symbol id="i-return" viewBox="0 0 24 24"><path d="m8 6-5 5 5 5m-5-5h12a5 5 0 0 1 5 5v2"/></symbol>
  </svg>

  <a href="#main-content" class="skip-link">Перейти к содержимому</a>
  <aside class="sidebar">
    <a class="brand" href="#catalog" aria-label="Книжная полка, каталог">
      <span class="brand-mark"><svg class="icon"><use href="#i-open"/></svg></span>
      <span>Книжная <br>полка</span>
    </a>
    <nav class="navigation" aria-label="Разделы библиотеки">
      <a href="#catalog" aria-current="page"><svg class="icon"><use href="#i-grid"/></svg>Каталог</a>
      <a href="#topics"><svg class="icon"><use href="#i-tag"/></svg>Темы</a>
      <a href="#loans"><svg class="icon"><use href="#i-loan"/></svg>Выдачи</a>
    </nav>
    <div class="profile">
      <span class="profile-icon"><svg class="icon"><use href="#i-user"/></svg></span>
      <span id="profile-label">Режим ребёнка</span>
    </div>
  </aside>

  <main id="main-content" tabindex="-1">
    <header class="toolbar">
      <div class="breadcrumb"><svg class="icon"><use href="#i-open"/></svg><svg class="icon breadcrumb-divider"><use href="#i-right"/></svg><span id="page-name">Каталог</span></div>
      <div class="toolbar-actions">
        <button class="button secondary" type="button" id="mode-button" data-action="mode"><svg class="icon"><use href="#i-lock"/></svg><span>Режим родителя</span></button>
        <button class="button primary" type="button" data-action="add"><svg class="icon"><use href="#i-plus"/></svg><span>Добавить книгу</span></button>
      </div>
    </header>

    <section id="catalog-page" aria-labelledby="catalog-title">
      <div class="hero">
        <div class="hero-content">
          <h1 id="catalog-title">Домашняя<br>библиотека</h1>
          <p>Ищите книги по названию, автору или теме.</p>
        </div>
        <img class="hero-art" src="/art/library.jpg" alt="" width="1152" height="614" fetchpriority="high">
      </div>

      <div class="filters" role="search" aria-label="Поиск по каталогу">
        <label class="search-field">
          <svg class="icon"><use href="#i-search"/></svg>
          <span class="sr-only">Поиск по каталогу</span>
          <input type="search" id="search" placeholder="Поиск по каталогу…" autocomplete="off" maxlength="120">
        </label>
        <div class="select-field">
          <label class="sr-only" for="genre">Жанр</label>
          <select id="genre"><option value="">Все жанры</option></select>
          <svg class="icon"><use href="#i-down"/></svg>
        </div>
        <div class="select-field">
          <label class="sr-only" for="topic">Тема</label>
          <select id="topic"><option value="">Все темы</option></select>
          <svg class="icon"><use href="#i-down"/></svg>
        </div>
      </div>

      <div class="section-heading">
        <div class="heading-group"><h2 id="results-title">Все книги</h2><span class="count" id="result-count" aria-live="polite">…</span></div>
        <div class="select-field sort-field">
          <svg class="icon sort-icon"><use href="#i-sort"/></svg>
          <label class="sr-only" for="sort">Сортировка</label>
          <select id="sort"><option value="new">Сначала новые</option><option value="title">По названию</option><option value="year">По году издания</option></select>
          <svg class="icon"><use href="#i-down"/></svg>
        </div>
      </div>
      <div id="book-list" class="book-grid" aria-labelledby="results-title" aria-busy="true"></div>
      <div class="catalog-footer"><button class="text-button" type="button" data-action="examples" id="clear-examples" hidden>Убрать примеры из каталога</button></div>
    </section>

    <section id="topics-page" aria-labelledby="topics-title" hidden>
      <div class="page-intro"><h1 id="topics-title">Темы</h1><p>Выберите тему, чтобы увидеть все книги по ней.</p></div>
      <div id="topic-list" class="topic-grid"></div>
    </section>

    <section id="loans-page" aria-labelledby="loans-title" hidden>
      <div class="page-intro"><h1 id="loans-title">Выдачи</h1><p>Книги, которые сейчас на руках.</p></div>
      <div id="loan-list" class="loan-list"></div>
    </section>
    <noscript>Чтобы открыть каталог, включите JavaScript в браузере.</noscript>
  </main>

  <dialog id="dialog" aria-labelledby="dialog-title"><div id="dialog-content"></div></dialog>
  <div id="notice" class="notice" role="status" hidden></div>
</body>
</html>
